name: Build & Publish Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Validate release signing secrets
        run: |
          if [ -z "${{ secrets.SONARY_KEYSTORE_BASE64 }}" ] || \
             [ -z "${{ secrets.SONARY_STORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.SONARY_KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.SONARY_KEY_PASSWORD }}" ]; then
            echo "Erro: configure SONARY_KEYSTORE_BASE64, SONARY_STORE_PASSWORD, SONARY_KEY_ALIAS e SONARY_KEY_PASSWORD nos Secrets do repositório."
            exit 1
          fi

      - name: Decode and verify release keystore
        env:
          SONARY_KEYSTORE_BASE64: ${{ secrets.SONARY_KEYSTORE_BASE64 }}
          SONARY_STORE_PASSWORD: ${{ secrets.SONARY_STORE_PASSWORD }}
          SONARY_KEY_ALIAS: ${{ secrets.SONARY_KEY_ALIAS }}
          SONARY_KEY_PASSWORD: ${{ secrets.SONARY_KEY_PASSWORD }}
        run: |
          node -e '
            const fs = require("fs");
            const clean = (process.env.SONARY_KEYSTORE_BASE64 || "").replace(/\s+/g, "");
            if (!clean) {
              console.error("Erro: SONARY_KEYSTORE_BASE64 está vazio.");
              process.exit(1);
            }
            if (!/^[A-Za-z0-9+/]+={0,2}$/.test(clean) || clean.length % 4 !== 0) {
              console.error("Erro: SONARY_KEYSTORE_BASE64 contém caracteres inválidos ou está truncado (tamanho: " + clean.length + "). Use: npm run init:keystore -- --copy-b64");
              process.exit(1);
            }
            const buf = Buffer.from(clean, "base64");
            if (buf.length < 500) {
              console.error("Erro: keystore decodificada parece truncada (" + buf.length + " bytes).");
              process.exit(1);
            }
            fs.writeFileSync("sonary-release.keystore", buf);
            console.log("Keystore decodificada:", buf.length, "bytes");
          '
          cat <<'EOF' > /tmp/VerifyKeystore.java
          import java.io.FileInputStream;
          import java.security.Key;
          import java.security.KeyStore;

          public class VerifyKeystore {
            public static void main(String[] args) throws Exception {
              String storePass = System.getenv("SONARY_STORE_PASSWORD");
              String alias = System.getenv("SONARY_KEY_ALIAS");
              String keyPass = System.getenv("SONARY_KEY_PASSWORD");
              KeyStore ks = KeyStore.getInstance("PKCS12");
              try (FileInputStream fis = new FileInputStream("sonary-release.keystore")) {
                ks.load(fis, storePass.toCharArray());
              }
              if (!ks.containsAlias(alias)) {
                throw new RuntimeException("Alias não encontrado na keystore: " + alias);
              }
              Key key = ks.getKey(alias, keyPass.toCharArray());
              if (key == null) {
                throw new RuntimeException("Chave privada retornou null para o alias: " + alias);
              }
              System.out.println("Keystore, alias e SONARY_KEY_PASSWORD validados com sucesso.");
            }
          }
          EOF
          java /tmp/VerifyKeystore.java
          rm -f /tmp/VerifyKeystore.java

      - name: Prebuild and patch Android project
        run: |
          npx expo prebuild --clean --platform android
          node scripts/patch-android.js

      - name: Build signed Release APK
        env:
          SONARY_REQUIRE_RELEASE_SIGNING: '1'
          SONARY_UPLOAD_STORE_FILE: 'sonary-release.keystore'
          SONARY_UPLOAD_STORE_PASSWORD: ${{ secrets.SONARY_STORE_PASSWORD }}
          SONARY_UPLOAD_KEY_ALIAS: ${{ secrets.SONARY_KEY_ALIAS }}
          SONARY_UPLOAD_KEY_PASSWORD: ${{ secrets.SONARY_KEY_PASSWORD }}
        run: npm run build:apk

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Generate release artifacts (latest.json & checksums.txt)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/generate-release-manifest.js

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -e "console.log(require('./app.json').expo.version)")
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
          else
            gh release create "$TAG" dist-release/* \
              --title "Sonary Pro $TAG" \
              --generate-notes
          fi
